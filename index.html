<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="aRzbAlHWDs2AZ-LE" />
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <title>MARINA AGRO | L'excellence de la mer</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --marine: #002D62; --cyan: #00B5E2; --white: #ffffff; --bg: #f9f9f9; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; color: #333; line-height: 1.6; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; background: white; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo-nav { height: 50px; }
        .menu a { margin-left: 25px; text-decoration: none; color: var(--marine); font-weight: 600; font-size: 13px; text-transform: uppercase; }

        /* Hero Section */
        .hero { background: linear-gradient(rgba(0,45,98,0.6), rgba(0,45,98,0.6)), url('https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=1350&q=80'); 
                height: 60vh; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .hero h1 { font-size: 3rem; letter-spacing: 5px; text-transform: uppercase; }

        /* Section Qui Sommes-Nous */
        .about { padding: 80px 15%; text-align: center; background: white; }
        .about h2 { color: var(--marine); letter-spacing: 2px; }

        /* Section Contact & Formulaire */
        .contact-container { padding: 60px 10%; background: var(--bg); display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .info-box h3 { color: var(--marine); }
        .contact-form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-send { background: var(--marine); color: white; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-send:hover { background: var(--cyan); }

        footer { background: #111; color: white; padding: 40px 8%; text-align: center; }
        .qr-code { width: 120px; border: 4px solid white; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

<nav>
    <img src="logo.jpg" alt="Logo Marina Agro" class="logo-nav">
    <div class="menu">
        <a href="#about">Notre Vision</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<section class="hero">
    <h1>L'Excellence de la Mer en conserve </h1>
</section>

<section class="about" id="about">
    <h2>QUI SOMMES-NOUS ?</h2>
</section>

<section class="contact-container" id="contact">
    <div class="info-box">
        <h3>Nos Coordonnées</h3>
        <p><strong>Adresse :</strong> Zone industrielle Azaghar Ouest, îlot 333, section 14, Akbou, Béjaïa.</p>
        <p><strong>WhatsApp :</strong> +(213) 563 04 3826.</p>
    </div>

    <div class="contact-form">
        <form action="https://formspree.io/f/mqewgobj" method="POST">
            <div class="input-group">
                <label>Nom Complet</label>
                <input type="text" name="nom" required>
            </div>
            <div class="input-group">
                <label> contact.marinagro@gmail.com </label>
                <input type="email" name="email" required>
            </div>
            <div class="input-group">
                <label>Message</label>
                <textarea name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn-send">ENVOYER</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2026 MARINA AGRO - Akbou, Algérie</p>
    <img src="qr.jpg" alt="QR Code Marina Agro" class="qr-code">
</footer>

</body>
</html>
